name: shellcheck

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          # xclip is a zsh script (shellcheck doesn't support zsh) — check the bash scripts only
          shellcheck -S error install.sh uninstall.sh
